<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f9f7">
  <title>青映AI · 作品展示方向预览</title>
  <link rel="icon" href="./assets/logo.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="review-bar" aria-label="原型方向选择">
    <span class="review-label">方向预览</span>
    <div class="directions" role="group" aria-label="切换设计方向">
      <button data-direction="screening" aria-pressed="true">A 精选放映</button>
      <button data-direction="gallery" aria-pressed="false">B 明亮作品集</button>
      <button data-direction="series" aria-pressed="false">C 系列栏目</button>
    </div>
    <span class="prototype-note">示意封面 · 未接入视频</span>
  </aside>
  <header class="site-header">
    <a class="brand" href="#" aria-label="青映AI首页"><img src="./assets/logo.png" width="36" height="36" alt=""><strong>青映AI</strong><span>作品集</span></a>
    <nav aria-label="页面导航"><a href="#works">浏览作品 <span aria-hidden="true">↗</span></a></nav>
  </header>
  <main id="main"></main>
  <footer><span>青映AI · 让每一次创作，都成为品牌资产</span><span>本页为设计原型，作品标题及封面用于布局示意。</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
